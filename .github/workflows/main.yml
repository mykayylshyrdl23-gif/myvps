name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Enable Remote Desktop & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "SecurityLayer" -Value 0
          
      - name: 2. Create Admin Account with Verification
        run: |
          # Create the user
          $Password = ConvertTo-SecureString "Mikaeel2026!" -AsPlainText -Force
          New-LocalUser -Name "mikaeel" -Password $Password -PasswordNeverExpires -FullName "Mikaeel Admin" -Description "RDP Admin User" -ErrorAction SilentlyContinue
          
          # Add to Administrators group
          Add-LocalGroupMember -Group "Administrators" -Member "mikaeel" -ErrorAction SilentlyContinue
          
          # Also set runneradmin password
          Set-LocalUser -Name "runneradmin" -Password $Password
          
          # Verify user was created
          $user = Get-LocalUser -Name "mikaeel" -ErrorAction SilentlyContinue
          if ($user) {
            Write-Host "✅ User 'mikaeel' created successfully!" -ForegroundColor Green
            Write-Host "   Account Enabled: $($user.Enabled)" -ForegroundColor Cyan
          } else {
            Write-Host "❌ Failed to create user 'mikaeel'" -ForegroundColor Red
          }
          
          # Verify admin group membership
          $admins = Get-LocalGroupMember -Group "Administrators" | Where-Object { $_.Name -like "*mikaeel*" }
          if ($admins) {
            Write-Host "✅ User 'mikaeel' is in Administrators group!" -ForegroundColor Green
          }
          
      - name: 3. Allow RDP Access for Specific User
        run: |
          # Allow the user to log in via RDP
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0
          
          # Add user to Remote Desktop Users group
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "mikaeel" -ErrorAction SilentlyContinue
          
          # Enable NLA (Network Level Authentication) 
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0
          
          Write-Host "✅ RDP access configured for mikaeel" -ForegroundColor Green
          
      - name: 4. Install & Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          # Download and install Tailscale silently
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait
          
          # Connect to Tailscale network
          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="github-rdp-server"
          
          Start-Sleep -Seconds 8
          
          # Get Tailscale IP
          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          
          # Get current user info for verification
          $currentUser = whoami
          
          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  >>> RDP SERVER IS READY! <<<" -ForegroundColor Cyan
          Write-Host "  Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "  Username     : mikaeel" -ForegroundColor Yellow
          Write-Host "  Password     : Mikaeel2026!" -ForegroundColor Yellow
          Write-Host "  Domain       : $env:COMPUTERNAME" -ForegroundColor Yellow
          Write-Host "  >> Open mstsc and connect to: $ts_ip" -ForegroundColor Magenta
          Write-Host "  >> Use username: mikaeel" -ForegroundColor Magenta
          Write-Host "  >> Password: Mikaeel2026!" -ForegroundColor Magenta
          Write-Host "==================================================" -ForegroundColor Green
          
      - name: 5. Keep Server Alive (6 Hours)
        run: |
          for ($i = 1; $i -le 360; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "[$i/360] Server running..."
          }
